

services:
  frontend:
    build:
      context: .
      args:
        NEXT_PUBLIC_BRAND: ${NEXT_PUBLIC_BRAND:-zoo}
        API_URL: https://api.netvol.org
        NEXT_PUBLIC_API_URL: https://api.netvol.org
        YANDEX_API_KEY: 841198fb-e942-4b66-bdff-19bd7c578805
    container_name: zoo
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_BRAND: ${NEXT_PUBLIC_BRAND:-zoo}
      API_URL: https://api.netvol.org
      NEXT_PUBLIC_API_URL: https://api.netvol.org
      YANDEX_API_KEY: 841198fb-e942-4b66-bdff-19bd7c578805
    ports:
      - "3000:3000"
