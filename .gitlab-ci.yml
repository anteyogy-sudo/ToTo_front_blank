stages:
  - build
  - deploy

variables:
  IMAGE_NAME: "commerce/antey/frontend"
  TAG: "$CI_COMMIT_REF_NAME"
  DEPLOY_PATH: "/opt/antey/frontend"
  SERVICE: "frontend"

build:
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  stage: build
  script:
    - echo "{\"auths\":{\"$СI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor --context $CI_PROJECT_DIR --cache --dockerfile $CI_PROJECT_DIR/Dockerfile --destination $CI_REGISTRY/$IMAGE_NAME:$TAG
  tags:
    - base

deploy:
  stage: deploy  
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh
    - mkdir -p ~/.ssh
    - echo "$DEV_SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - echo -e "Host *\n\tStrictHostKeyChecking no\n" > ~/.ssh/config
  script:
      - scp ./docker-compose.yml $DEV_HOST:/opt/antey/frontend/
      - ssh -T $DEV_HOST "cd /opt/antey/frontend/ && docker-compose pull"
      - ssh -T $DEV_HOST "cd /opt/antey/frontend/ && docker-compose up -d --force-recreate --remove-orphans --no-deps"
      - ssh -T $DEV_HOST "docker image prune -af && docker builder prune -af"
  tags:
    - base
